<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#800000">
<title>Twinz Music – Musik-Adventskalender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#790000}
body{display:flex;justify-content:center}
.page{position:relative;width:min(100%,720px);line-height:0;overflow:hidden}
.design{display:block;width:100%;height:auto}
.link{position:absolute;z-index:2;display:block;cursor:pointer;border-radius:10px}
.link:focus-visible{outline:4px solid white;outline-offset:3px}
.playlist{left:9.3%;top:71.4%;width:24%;height:19.5%}
.spotify-button{left:39%;top:79%;width:52%;height:11.5%;border-radius:35px}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.flake{position:absolute;top:-4%;left:var(--x);width:var(--s);height:var(--s);background:white;border-radius:50%;opacity:var(--o);filter:blur(var(--b));animation:fall var(--d) linear var(--delay) infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-20px,0)}to{transform:translate3d(var(--drift),1800px,0)}}
@media(prefers-reduced-motion:reduce){.flake{display:none}}
</style>
</head>
<body>
<main class="page">
<img class="design" src="design.png" alt="Twinz Music Musik-Adventskalender: Schokolade für die Ohren. Na, na, na! Wer wird denn da schon vor dem 1. Dezember auspacken wollen? 26 Tage, 26 Songs, jede Menge Überraschungen. Du möchtest schon jetzt etwas Weihnachtsmusik naschen? Hier zu Spotify!">
<a class="link playlist" href="https://open.spotify.com/playlist/5laQ8Xs4IQW3FDpiucxB6w" target="_blank" rel="noopener noreferrer" aria-label="Adventskalender-Playlist auf Spotify öffnen"></a>
<a class="link spotify-button" href="https://open.spotify.com/playlist/5laQ8Xs4IQW3FDpiucxB6w" target="_blank" rel="noopener noreferrer" aria-label="Hier zu Spotify – Adventskalender-Playlist öffnen"></a>
<div class="snow" aria-hidden="true" id="snow"></div>
</main>
<script>
const snow=document.getElementById('snow');
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
 for(let i=0;i<65;i++){
  const f=document.createElement('span');f.className='flake';
  f.style.setProperty('--x',Math.random()*100+'%');
  f.style.setProperty('--s',(1+Math.random()*4)+'px');
  f.style.setProperty('--o',(0.25+Math.random()*0.65).toFixed(2));
  f.style.setProperty('--b',(Math.random()*1.2).toFixed(1)+'px');
  f.style.setProperty('--d',(9+Math.random()*14).toFixed(1)+'s');
  f.style.setProperty('--delay',(-Math.random()*23).toFixed(1)+'s');
  f.style.setProperty('--drift',(-65+Math.random()*130).toFixed(0)+'px');
  snow.appendChild(f);
 }
}
</script>
</body>
</html>
